name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dev tooling (np, lint-staged) needs Node 22+. The library itself
        # runs in the browser, so engines stays at >=20.19 for consumers.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:js
      - run: yarn lint:css
      - run: yarn build
      - name: Check that the committed dist/ matches the source
        if: matrix.node == '24'
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is out of date. Run 'yarn build' and commit the result."
            exit 1
          fi
      - run: yarn test:coverage
      - run: yarn test
      - run: yarn lint:package

  browser:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test:browser
        env:
          # Fail instead of skipping when Chrome is missing or cannot start.
          RAZORBOX_REQUIRE_BROWSER: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
